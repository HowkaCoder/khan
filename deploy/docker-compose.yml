name: khan

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    NATS_URL: nats://nats:4222
    DATABASE_URL: postgres://khan:khan@postgres:5432/khan?sslmode=disable
    SYMBOLS: ACME-USD
    DEPOSITS_ENABLED: "true"
  depends_on:
    nats: { condition: service_healthy }
    postgres: { condition: service_healthy }

services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [nats:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: khan
      POSTGRES_PASSWORD: khan
      POSTGRES_DB: khan
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "khan"]
      interval: 2s
      retries: 20

  api:
    <<: *app
    command: ["api"]
    ports: ["8080:8080"]

  engine:
    <<: *app
    command: ["engine"]
    ports: ["8081:8081"]
    restart: "no"
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://khan:khan@postgres:5432/khan?sslmode=disable
      ENGINE_SYMBOL: ACME-USD
      SNAPSHOT_EVERY: "1000"

  settlement:
    <<: *app
    command: ["settlement"]

volumes:
  nats:
  pg:
